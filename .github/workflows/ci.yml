name: CI

on:
  push:
    branches: ["main", "claude/**"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.os }} · Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.9", "3.11", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      # Installed without extras first: the suite must pass on a bare
      # standard library, since that is what the project promises.
      - name: Install (no optional dependencies)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Test without optional dependencies
        run: pytest -q

      - name: Install optional dependencies
        run: pip install watchdog yara-python
        continue-on-error: true

      - name: Test with optional dependencies
        run: pytest -q

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff
      - run: ruff check .
